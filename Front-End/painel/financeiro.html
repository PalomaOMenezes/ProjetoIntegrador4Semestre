<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Financeiro - SmileClinic</title>
    <script src="theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="painel.css" />
  </head>
  <body data-pagina="financeiro">
    <div class="app-shell">
      <div id="sidebar-slot"></div>

      <main class="conteudo">
        <header class="page-header">
          <div class="page-header-titulo">
            <h1>Financeiro</h1>
          </div>
          <div class="page-acoes">
            <button type="button" id="btn-novo-lancamento" class="btn btn-primario">
              + Novo lançamento
            </button>
          </div>
        </header>

        <section class="barra-filtros" aria-label="Filtros do financeiro">
          <div class="controle-data">
            <button type="button" id="fin-mes-anterior" class="icon-btn" aria-label="Mês anterior">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <polyline points="15 18 9 12 15 6" />
              </svg>
            </button>
            <span
              id="fin-mes-rotulo"
              class="td-forte"
              style="min-width: 140px; text-align: center; text-transform: capitalize"
            ></span>
            <button type="button" id="fin-mes-seguinte" class="icon-btn" aria-label="Próximo mês">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <polyline points="9 18 15 12 9 6" />
              </svg>
            </button>
          </div>

          <div id="seg-tipo-fin" class="segmented" role="tablist" aria-label="Tipo de lançamento">
            <div class="segmented-thumb" aria-hidden="true"></div>
            <button type="button" role="tab" data-tipo="" aria-selected="true">Todos</button>
            <button type="button" role="tab" data-tipo="receita" aria-selected="false">Receitas</button>
            <button type="button" role="tab" data-tipo="despesa" aria-selected="false">Despesas</button>
          </div>

          <select id="filtro-fin-status" class="select" aria-label="Filtrar por status">
            <option value="">Todos os status</option>
            <option value="pago">Pago</option>
            <option value="pendente">Pendente</option>
            <option value="cancelado">Cancelado</option>
          </select>

          <div class="campo-busca">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input
              type="search"
              id="filtro-fin-busca"
              class="input"
              placeholder="Buscar descrição ou categoria"
              aria-label="Buscar lançamento"
            />
          </div>
        </section>

        <section class="kpi-grid" aria-label="Resumo financeiro do mês">
          <div class="kpi-card">
            <span class="kpi-rotulo">Valor recebido</span>
            <span id="fin-recebido" class="kpi-valor">R$ 0</span>
          </div>
          <div class="kpi-card">
            <span class="kpi-rotulo">A receber</span>
            <span id="fin-a-receber" class="kpi-valor">R$ 0</span>
          </div>
          <div class="kpi-card">
            <span class="kpi-rotulo">Despesas pagas</span>
            <span id="fin-despesas" class="kpi-valor">R$ 0</span>
          </div>
          <div class="kpi-card">
            <span class="kpi-rotulo">Saldo do período</span>
            <span id="fin-saldo" class="kpi-valor">R$ 0</span>
          </div>
        </section>

        <section class="card" aria-label="Lançamentos financeiros">
          <div class="tabela-wrap">
            <table>
              <thead>
                <tr>
                  <th>Data</th>
                  <th>Descrição</th>
                  <th>Categoria</th>
                  <th>Vínculo</th>
                  <th>Pagamento</th>
                  <th>Valor</th>
                  <th>Status</th>
                  <th class="td-acoes">Ações</th>
                </tr>
              </thead>
              <tbody id="lista-financeiro"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <!-- Modal: Novo / Editar Lançamento -->
    <div id="modal-lancamento" class="modal-backdrop" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-lancamento">
      <div class="modal-sheet">
        <div class="modal-topo">
          <h2 id="titulo-modal-lancamento">Novo lançamento</h2>
          <button type="button" class="icon-btn" data-fechar-modal aria-label="Fechar">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
        <form id="form-lancamento" class="form-grid">
          <input type="hidden" name="id" />
          <div class="form-row">
            <div class="campo">
              <label for="l-tipo">Tipo</label>
              <select id="l-tipo" name="tipo" class="select" required>
                <option value="receita">Receita</option>
                <option value="despesa">Despesa</option>
              </select>
            </div>
            <div class="campo">
              <label for="l-status">Status</label>
              <select id="l-status" name="status" class="select" required>
                <option value="pendente">Pendente</option>
                <option value="pago">Pago</option>
                <option value="cancelado">Cancelado</option>
              </select>
            </div>
          </div>
          <div class="campo">
            <label for="l-desc">Descrição</label>
            <input id="l-desc" name="descricao" class="input" required minlength="3" />
          </div>
          <div class="form-row">
            <div class="campo">
              <label for="l-cat">Categoria</label>
              <input id="l-cat" name="categoria" class="input" required minlength="2" placeholder="Ex.: Dentística, Materiais" />
            </div>
            <div class="campo">
              <label for="l-valor">Valor (R$)</label>
              <input id="l-valor" name="valor" type="number" step="0.01" min="0.01" class="input tabular" required />
            </div>
          </div>
          <div class="form-row">
            <div class="campo">
              <label for="l-data">Data de competência</label>
              <input id="l-data" name="data_competencia" type="date" class="input tabular" required />
            </div>
            <div class="campo">
              <label for="l-forma">Forma de pagamento</label>
              <select id="l-forma" name="forma_pagamento" class="select">
                <option value="">Não informada</option>
                <option value="PIX">PIX</option>
                <option value="Cartão de crédito">Cartão de crédito</option>
                <option value="Débito">Débito</option>
                <option value="Dinheiro">Dinheiro</option>
                <option value="Boleto">Boleto</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="campo">
              <label for="l-pac">Paciente</label>
              <select id="l-pac" name="paciente_id" class="select"></select>
            </div>
            <div class="campo">
              <label for="l-dent">Profissional</label>
              <select id="l-dent" name="dentista_id" class="select"></select>
            </div>
          </div>
          <p id="erro-lancamento" class="erro-inline" role="alert"></p>
          <div class="form-rodape">
            <button type="button" class="btn btn-secundario" data-fechar-modal>Cancelar</button>
            <button type="submit" class="btn btn-primario">Salvar lançamento</button>
          </div>
        </form>
      </div>
    </div>

    <script src="core.js"></script>
    <script src="painel.js"></script>
  </body>
</html>
