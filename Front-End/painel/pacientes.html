<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pacientes - SmileClinic</title>
    <script src="theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="painel.css" />
  </head>
  <body data-pagina="pacientes">
    <div class="app-shell">
      <div id="sidebar-slot"></div>

      <main class="conteudo">
        <header class="page-header">
          <div class="page-header-titulo">
            <h1>Pacientes</h1>
          </div>
          <div class="page-acoes">
            <button type="button" id="btn-novo-paciente" class="btn btn-primario">
              + Novo paciente
            </button>
          </div>
        </header>

        <section class="barra-filtros" aria-label="Busca de pacientes">
          <div class="campo-busca">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input
              type="search"
              id="busca-paciente"
              class="input"
              placeholder="Buscar por nome ou CPF"
              aria-label="Buscar paciente por nome ou CPF"
            />
          </div>
          <span id="total-pacientes" class="td-secundario tabular"></span>
        </section>

        <section class="card" aria-label="Lista de pacientes">
          <div class="tabela-wrap">
            <table>
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>Nascimento</th>
                  <th>CPF</th>
                  <th>Telefone</th>
                  <th>Anamnese</th>
                  <th class="td-acoes">Ações</th>
                </tr>
              </thead>
              <tbody id="lista-pacientes"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <!-- Modal: Novo / Editar Paciente -->
    <div id="modal-paciente" class="modal-backdrop" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-paciente">
      <div class="modal-sheet">
        <div class="modal-topo">
          <h2 id="titulo-modal-paciente">Novo paciente</h2>
          <button type="button" class="icon-btn" data-fechar-modal aria-label="Fechar">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
        <form id="form-paciente" class="form-grid">
          <input type="hidden" name="id" />
          <div class="campo">
            <label for="p-nome">Nome completo</label>
            <input id="p-nome" name="nome" class="input" required minlength="3" autocomplete="off" />
          </div>
          <div class="form-row">
            <div class="campo">
              <label for="p-cpf">CPF</label>
              <input id="p-cpf" name="cpf" class="input tabular" required inputmode="numeric" placeholder="000.000.000-00" />
            </div>
            <div class="campo">
              <label for="p-nasc">Data de nascimento</label>
              <input id="p-nasc" name="data_nascimento" type="date" class="input tabular" />
            </div>
          </div>
          <div class="form-row">
            <div class="campo">
              <label for="p-tel">Telefone</label>
              <input id="p-tel" name="telefone" class="input tabular" required inputmode="tel" placeholder="(11) 99999-9999" />
            </div>
            <div class="campo">
              <label for="p-end">Endereço</label>
              <input id="p-end" name="endereco" class="input" required minlength="5" />
            </div>
          </div>
          <div class="campo">
            <label for="p-anam">Anamnese</label>
            <textarea
              id="p-anam"
              name="anamnese"
              class="textarea"
              placeholder="Alergias, medicamentos em uso, hipertensão, cirurgias"
            ></textarea>
          </div>
          <p id="erro-paciente" class="erro-inline" role="alert"></p>
          <div class="form-rodape">
            <button type="button" class="btn btn-secundario" data-fechar-modal>Cancelar</button>
            <button type="submit" class="btn btn-primario">Salvar paciente</button>
          </div>
        </form>
      </div>
    </div>

    <script src="core.js"></script>
    <script src="painel.js"></script>
  </body>
</html>
